services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  worker:
    build: ./server
    command: ["node", "dist/jobs/worker.js"]
    env_file:
      - ./server/.env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
